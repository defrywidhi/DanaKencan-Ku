<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/logo-danakencan.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Judul Web -->
    <title>DanaKencan-Ku | Rencana Keuangan Anda</title>

    <!-- Meta Description untuk Google Search -->
    <meta name="description" content="Aplikasi pencatatan keuangan pasangan. Rencana keuangan Anda, masa depan kita bersama.">

    <!-- Open Graph untuk Preview WhatsApp / Facebook / Telegram -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="DanaKencan-Ku 💖">
    <meta property="og:description" content="Rencana Keuangan Anda, Masa Depan Kita Bersama. Kelola urunan dan pengeluaran tanpa drama.">
    
    <!-- (DIUBAH) Wajib gunakan URL Absolute (Lengkap dengan https://) -->
    <meta property="og:url" content="https://danakencan-ku.vercel.app/">
    <meta property="og:image" content="https://danakencan-ku.vercel.app/logo-danakencan.jpg">
    
    <!-- (TAMBAHAN) WhatsApp merender preview lebih cepat jika dimensi gambar disebutkan -->
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="500">
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
